name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        react: ['18.2.0', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ startsWith(matrix.react, '18') && '18' || '19' }} @types/react-dom@${{ startsWith(matrix.react, '18') && '18' || '19' }}
      - run: npm run check
        env:
          REACT_VERSION: ${{ startsWith(matrix.react, '18') && '18' || '19' }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
