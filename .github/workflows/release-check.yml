name: Release readiness (no publication)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --pack-destination /tmp
      - uses: actions/upload-artifact@v4
        with:
          name: npm-review-artifact
          path: /tmp/thuraaung2493-nrc-kit-*.tgz
